name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build debug APK
        run: gradle clean assembleDebug --no-daemon
      - name: Verify APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          for f in $(unzip -Z1 $APK | grep -E '^classes[0-9]*\.dex$'); do unzip -p $APK $f; done > /tmp/all.dex
          for c in MainActivity LayerService LayerOverlay BootReceiver EyesView Mood MusicListener Mods; do
            grep -aq "com/iskra/layer/$c" /tmp/all.dex || { echo "MISSING $c"; exit 1; }
          done
          echo "APK OK"
      - uses: actions/upload-artifact@v4
        with:
          name: iskra-layer-apk-v7
          path: app/build/outputs/apk/debug/app-debug.apk
